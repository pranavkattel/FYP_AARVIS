<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Face Login – AARVIS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; color: #e0e0e0;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%; max-width: 480px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
        .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 28px; line-height: 1.5; }

        #videoWrap {
            position: relative; border-radius: 14px; overflow: hidden;
            background: #000; width: 100%; aspect-ratio: 4/3;
            display: none; margin-bottom: 20px;
        }
        #faceVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
        #overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.55); padding: 10px;
            font-size: 0.85rem; color: #fff;
        }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; margin: 4px 0 0; }
        .progress-fill { height: 100%; border-radius: 3px; background: #4ade80; transition: width 0.3s; }

        .btn {
            display: block; width: 100%; padding: 14px;
            border: none; border-radius: 12px; cursor: pointer;
            font-size: 0.95rem; font-weight: 600; margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #aaa; font-size: 0.85rem;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        #msg { font-size: 0.85rem; color: #facc15; min-height: 20px; margin-bottom: 16px; }
        #success { display:none; color: #4ade80; font-size: 1rem; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h1>&#128247; Set Up Face Login</h1>
    <p class="sub">Let AARVIS recognise you automatically.<br>Look at the camera and we'll capture your face.</p>

    <div id="videoWrap">
        <video id="faceVideo" autoplay muted playsinline></video>
        <div id="overlay">
            <span id="overlayText">Getting ready…</span>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
    </div>

    <div id="msg"></div>
    <div id="success">&#10003; Face enrolled! Redirecting to your mirror…</div>

    <button class="btn btn-primary" id="startBtn" onclick="startCapture()">Start Camera &amp; Capture</button>
    <button class="btn btn-secondary" onclick="skip()">Skip for now</button>
</div>

<script>
    // Store token from URL into localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get('token');
    if (urlToken) { localStorage.setItem('sessionToken', urlToken); }

    const TOTAL_FRAMES = 12;
    let stream = null;
    let captured = [];
    let capturing = false;

    async function startCapture() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        setMsg('');
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            const vid = document.getElementById('faceVideo');
            vid.srcObject = stream;
            await vid.play();
            document.getElementById('videoWrap').style.display = 'block';
            btn.style.display = 'none';
            captured = [];
            capturing = true;
            setOverlay('Look straight at the camera…');
            captureLoop(vid);
        } catch(e) {
            btn.disabled = false;
            setMsg('Camera access denied. Please allow camera and try again.');
        }
    }

    async function captureLoop(vid) {
        while (captured.length < TOTAL_FRAMES && capturing) {
            const b64 = snapFrame(vid);
            captured.push(b64);
            const pct = Math.round((captured.length / TOTAL_FRAMES) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            setOverlay(`Capturing… ${captured.length}/${TOTAL_FRAMES}`);
            await sleep(400);
        }
        if (capturing) { submitFrames(); }
    }

    function snapFrame(vid) {
        const c = document.createElement('canvas');
        c.width = 320; c.height = 240;
        c.getContext('2d').drawImage(vid, 0, 0, 320, 240);
        return c.toDataURL('image/jpeg', 0.7);
    }

    async function submitFrames() {
        capturing = false;
        setOverlay('Processing…');
        try {
            const token = localStorage.getItem('sessionToken') || '';
            const res = await fetch('/api/face/enroll', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ images: captured })
            });
            if (res.status === 401 && token) {
                const retry = await fetch(`/api/face/enroll?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ images: captured })
                });
                const retryData = await retry.json();
                if (retryData.success) {
                    stopStream();
                    document.getElementById('videoWrap').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                    setTimeout(() => window.location.href = '/', 1800);
                } else {
                    stopStream();
                    document.getElementById('videoWrap').style.display = 'none';
                    setMsg(retryData.message || 'Could not detect a face. Please try again.');
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('startBtn').style.display = 'block';
                }
                return;
            }
            const data = await res.json();
            if (data.success) {
                stopStream();
                document.getElementById('videoWrap').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                setTimeout(() => window.location.href = '/', 1800);
            } else {
                stopStream();
                document.getElementById('videoWrap').style.display = 'none';
                setMsg(data.message || 'Could not detect a face. Please try again.');
                document.getElementById('startBtn').disabled = false;
                document.getElementById('startBtn').style.display = 'block';
            }
        } catch(e) {
            stopStream();
            setMsg('Error saving face. You can skip and set it up later.');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').style.display = 'block';
        }
    }

    function stopStream() {
        capturing = false;
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    }

    function skip() { window.location.href = '/'; }
    function setMsg(t) { document.getElementById('msg').textContent = t; }
    function setOverlay(t) { document.getElementById('overlayText').textContent = t; }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
